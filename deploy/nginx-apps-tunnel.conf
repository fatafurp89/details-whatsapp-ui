# apps VPS (31.97.196.127): يستبدل /etc/nginx/sites-available/whatsapp.details-wms.cloud.tunnel بالكامل.
# نفس المنطق القديم تمامًا (الوثوق بالجسر عبر WireGuard فقط + ختم ترويسات الهوية) لكن مع تقسيم المسارات:
# API/الويبهوك/الصحة/الداخلي → الخلفية القديمة دون أي تغيير (127.0.0.1:3400)، وكل شيء آخر (الواجهة والأصول
# الثابتة) → الواجهة الأمامية الجديدة المبنية من لوفابل (127.0.0.1:3401). رجوع فوري: إعادة location / للمنفذ
# 3400 وحذف location الجديدة.
server {
    listen 10.9.0.3:80;
    server_name whatsapp.details-wms.cloud;
    client_max_body_size 64m;
    # only the bridge over WireGuard may stamp identities (local processes on this host are refused)
    allow 10.9.0.1;
    deny all;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    server_tokens off;

    # Internal service-to-service calls from the gateway (OTP over WhatsApp): no identity headers, no trust token.
    # Only the bridge (10.9.0.1) may reach it; the app additionally requires X-Gw-Proxy-Key and checks the peer address.
    location ^~ /internal/ {
        allow 10.9.0.1;
        allow 10.9.0.3;   # هذا الخادم نفسه (تطبيقات محلية كـ HR عبر عنوان النفق)
        deny all;
        proxy_pass http://127.0.0.1:3400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Gw-Trusted "";
        proxy_set_header X-Gw-Employee-No "";
        proxy_set_header Cookie "";
        proxy_read_timeout 30s;
    }

    # API + ويبهوك/صحة الخلفية القديمة (غير مُغيّرة إطلاقًا)
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Gw-Employee-Id $http_x_gw_employee_id;
        proxy_set_header X-Gw-Employee-No $http_x_gw_employee_no;
        proxy_set_header X-Gw-Name  $http_x_gw_name;
        proxy_set_header X-Gw-Email $http_x_gw_email;
        proxy_set_header X-Gw-Role  $http_x_gw_role;
        proxy_set_header X-Gw-Level $http_x_gw_level;
        include snippets/details-whatsapp-trust.conf;
        proxy_read_timeout 120s;
    }
    location = /webhook {
        proxy_pass http://127.0.0.1:3400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie "";
        proxy_set_header X-Gw-Employee-No "";
        proxy_read_timeout 30s;
    }
    location = /healthz {
        proxy_pass http://127.0.0.1:3400;
        proxy_set_header Host $host;
        proxy_set_header Cookie "";
        proxy_set_header X-Gw-Employee-No "";
    }

    # كل شيء آخر: الواجهة الجديدة (لوفابل) — الصفحات + الأصول الثابتة
    location / {
        proxy_pass http://127.0.0.1:3401;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_real_ip;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Gw-Employee-Id $http_x_gw_employee_id;
        proxy_set_header X-Gw-Employee-No $http_x_gw_employee_no;
        proxy_set_header X-Gw-Name  $http_x_gw_name;
        proxy_set_header X-Gw-Email $http_x_gw_email;
        proxy_set_header X-Gw-Role  $http_x_gw_role;
        proxy_set_header X-Gw-Level $http_x_gw_level;
        include snippets/details-whatsapp-trust.conf;
        proxy_read_timeout 120s;
    }
}
